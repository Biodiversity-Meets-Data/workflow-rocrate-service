[project]
name = "workflow-rocrate-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "roc-validator>=0.11.3",
    "rocrate>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
extend-select = ["I"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
