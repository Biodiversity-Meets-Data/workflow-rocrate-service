[project]
name = "workflow-rocrate-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.99",
    "bs4>=0.0.2",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "hera>=7.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "roc-validator>=0.11.3",
    "rocrate>=0.15.1",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.100",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
extend-select = ["I"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["rocrate.*", "rocrate_validator.*"]
ignore_missing_imports = true
